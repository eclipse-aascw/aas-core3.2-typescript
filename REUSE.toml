version = 1

# Files which can not carry a comment header: JSON (package.json and the npm
# lock file) and the list of authors, which is plain prose.
[[annotations]]
path = ["AUTHORS", "package.json", "package-lock.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 aas-core3.2-typescript AUTHORS"
SPDX-License-Identifier = "MIT"
